name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"
      - "!*b"

env:
  PLUGIN_NAME: html-export # Change this to match the id of your plugin.

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Build
        run: |
          npm install
          npm run build
          mkdir ${{ env.PLUGIN_NAME }}
          cp main.js manifest.json styles.css ${{ env.PLUGIN_NAME }}
          zip -r ${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip ${{ env.PLUGIN_NAME }}

      - name: Generate changelog
        id: changelog
        run: |
          # --match excludes the beta *b tags: without it, git describe finds
          # the nearest tag by commit graph distance, and a beta tag cut
          # between two stable releases sits closer than the actual previous
          # stable release tag — so the changelog silently shrank to "since
          # last beta" instead of "since last stable release".
          PREV=$(git describe --tags --match '[0-9]*.[0-9]*.[0-9]*' --exclude '*b' --abbrev=0 HEAD^ 2>/dev/null || echo "")
          RANGE="${PREV:+${PREV}..}HEAD"

          extract() {
            git log $RANGE --pretty=format:"- %s" | grep -E "^- $1" | \
              sed -E "s/^- [a-z]+(\([^)]+\))?: /- /" || true
          }

          FEAT=$(extract "feat")
          FIX=$(extract "fix")
          PERF=$(extract "perf")
          REF=$(extract "refactor")
          STYLE=$(extract "style")
          DOCS=$(extract "docs")
          OTHER=$(git log $RANGE --pretty=format:"- %s" \
            | grep -Ev "^- (feat|fix|perf|refactor|style|docs|chore|build|ci|test|Merge)" || true)

          BODY=""
          [ -n "$FEAT" ]  && BODY+=$'## 🚀 New features\n'"$FEAT"$'\n\n'
          [ -n "$FIX" ]   && BODY+=$'## 🐛 Bug fixes\n'"$FIX"$'\n\n'
          [ -n "$PERF" ]  && BODY+=$'## ⚡ Performance\n'"$PERF"$'\n\n'
          [ -n "$REF" ]   && BODY+=$'## ♻️ Refactor\n'"$REF"$'\n\n'
          [ -n "$STYLE" ] && BODY+=$'## 🎨 UI / styles\n'"$STYLE"$'\n\n'
          [ -n "$DOCS" ]  && BODY+=$'## 📝 Documentation\n'"$DOCS"$'\n\n'
          [ -n "$OTHER" ] && BODY+=$'## 🔧 Other changes\n'"$OTHER"$'\n\n'

          if [ -n "$PREV" ]; then
            REPO="${{ github.repository }}"
            BODY+="**Full changelog**: https://github.com/${REPO}/compare/${PREV}...${{ github.ref_name }}"
          fi

          {
            echo 'body<<EOF'
            echo "$BODY"
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            main.js
            manifest.json
            styles.css
            ${{ env.PLUGIN_NAME }}-${{ github.ref_name }}.zip

  docker-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64,linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME}}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
